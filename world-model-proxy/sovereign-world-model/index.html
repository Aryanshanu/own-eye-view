<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign World Model</title>
    <!-- MapLibre GL CSS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #060913; color: #00ffcc; font-family: 'Courier New', monospace; overflow: hidden; }
        #map { width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        #hud { 
            position: absolute; top: 20px; left: 20px; z-index: 10; 
            background: rgba(6, 9, 19, 0.9); padding: 20px; border-radius: 8px; 
            border: 1px solid #00ffcc; width: 340px; backdrop-filter: blur(10px); 
            box-shadow: 0 0 20px rgba(0,255,204,0.15);
        }
        .stat { margin: 10px 0; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .value { color: #ffffff; font-weight: bold; }
        .highlight { color: #00ff66; }
        .error { color: #ff3333; }
        #ai-input { width: 100%; background: #0a0f19; border: 1px solid #00ffcc; color: #fff; padding: 8px; margin-top: 10px; border-radius: 4px; font-family: monospace; box-sizing: border-box; }
        #ai-response { font-size: 12px; color: #aaa; margin-top: 8px; min-height: 40px; line-height: 1.4; }
        button { width: 100%; background: #00ffcc; color: #060913; border: none; padding: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; border-radius: 4px; }
        button:hover { background: #00ccaa; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* Search box (OSM/Nominatim place lookup) */
        #search-box {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
            width: 320px; max-width: calc(100vw - 40px);
        }
        #search-input {
            width: 100%; background: rgba(6, 9, 19, 0.9); border: 1px solid #00ffcc; color: #fff;
            padding: 10px 14px; border-radius: 24px; font-family: 'Courier New', monospace;
            box-sizing: border-box; backdrop-filter: blur(10px); outline: none;
        }
        #search-results {
            margin-top: 6px; background: rgba(6, 9, 19, 0.95); border: 1px solid #00ffcc33;
            border-radius: 8px; overflow: hidden; display: none;
        }
        #search-results div { padding: 8px 14px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #00ffcc22; }
        #search-results div:last-child { border-bottom: none; }
        #search-results div:hover { background: #00ffcc22; }

        /* Aircraft click popup */
        .maplibregl-popup-content {
            background: rgba(6, 9, 19, 0.95) !important; color: #00ffcc !important;
            border: 1px solid #00ffcc; border-radius: 6px; font-family: 'Courier New', monospace;
            font-size: 12px; padding: 10px 12px !important;
        }
        .maplibregl-popup-tip { border-top-color: rgba(6,9,19,0.95) !important; border-bottom-color: rgba(6,9,19,0.95) !important; }
        .maplibregl-popup-close-button { color: #00ffcc; font-size: 16px; }
        #popup-title { color: #fff; font-weight: bold; margin-bottom: 4px; }
        #legend {
            position: absolute; bottom: 24px; left: 20px; z-index: 10; display: flex; gap: 14px;
            background: rgba(6, 9, 19, 0.9); border: 1px solid #00ffcc33; border-radius: 8px;
            padding: 8px 14px; font-size: 11px; backdrop-filter: blur(10px);
        }
        #legend span { display: flex; align-items: center; gap: 5px; }
        #legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <div id="hud">
        <h3 style="margin-top:0; color:#00ffcc; letter-spacing: 1px; font-size: 16px; border-bottom: 1px solid #00ffcc; padding-bottom: 8px;">📡 WORLD MODEL MATRIX</h3>
        <div style="font-size: 11px; color: #777; margin: -6px 0 10px;">Map &amp; buildings: OpenStreetMap / OpenFreeMap · Flights: OpenSky</div>
        <div class="stat"><span>🧠 AI Node (TinyLlama):</span> <span id="ai-status" class="value">Initializing...</span></div>
        <div class="stat"><span>💾 Memory DB:</span> <span id="db-status" class="value">0 Records</span></div>
        <div class="stat"><span>📡 Proxy Feed:</span> <span id="feed-status" class="value">Standby</span></div>
        
        <div style="margin-top: 15px; border-top: 1px solid #00ffcc; padding-top: 10px;">
            <div style="font-size: 12px; margin-bottom: 5px;">Ask the AI about the data:</div>
            <input type="text" id="ai-input" placeholder="e.g., How many flights are active?" disabled>
            <button id="ai-btn" onclick="queryAI()" disabled>EXECUTE QUERY</button>
            <div id="ai-response">Awaiting AI initialization...</div>
        </div>
    </div>

    <div id="search-box">
        <input type="text" id="search-input" placeholder="🔍 Search a place (OpenStreetMap)...">
        <div id="search-results"></div>
    </div>

    <div id="legend">
        <span><i style="background:#00ff66"></i> Low altitude</span>
        <span><i style="background:#00ffcc"></i> Cruise</span>
        <span><i style="background:#ff9900"></i> High altitude</span>
    </div>

    <div id="map"></div>

    <!-- 1. MapLibre GL -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    
    <!-- 2. Application Logic -->
    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.0';
        import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.0/+esm';

        // --- CONFIGURATION ---
        env.allowLocalModels = false; // Force download from Hugging Face CDN (saves your Vercel bandwidth)
        env.useBrowserCache = true;
        
        // ⚠️ REPLACE THIS WITH YOUR ACTUAL WORKER URL FROM PHASE 1 ⚠️
        // `npm run deploy` prints it: https://world-model-proxy.<your-subdomain>.workers.dev
        // It can also be overridden without a redeploy: https://<your-site>/?proxy=<worker-url>
        const DEFAULT_PROXY_URL = "https://world-model-proxy.YOUR-SUBDOMAIN.workers.dev";
        const PROXY_WORKER_URL = new URLSearchParams(location.search).get('proxy') || DEFAULT_PROXY_URL;
        const PROXY_CONFIGURED = !PROXY_WORKER_URL.includes('YOUR-SUBDOMAIN');
        // ?demo=1 asks the worker for simulated flights (fallback if OpenSky blocks the worker)
        const DEMO_MODE = new URLSearchParams(location.search).get('demo') === '1';
        const FEED_URL = DEMO_MODE
            ? `${PROXY_WORKER_URL}${PROXY_WORKER_URL.includes('?') ? '&' : '?'}demo=1`
            : PROXY_WORKER_URL;

        // --- STATE ---
        let db, conn;
        let activeNow = 0; // aircraft in the most recent snapshot
        let totalTracked = 0, uniqueFlights = 0; // rolling-window stats, read back from DuckDB
        const MAX_ROWS = 5000; // Kept low to guarantee no browser crashes
        let aiGenerator = null;

        // --- 1. INITIALIZE DUCKDB-WASM ---
        async function initDB() {
            const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
            const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);
            const worker_url = URL.createObjectURL(new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' }));
            const worker = new Worker(worker_url);
            const logger = new duckdb.ConsoleLogger();
            db = new duckdb.AsyncDuckDB(logger, worker);
            await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
            URL.revokeObjectURL(worker_url);
            conn = await db.connect();

            // `seq` is an insert-order counter so old rows can be trimmed cheaply,
            // without re-inserting the whole rolling window on every poll.
            await conn.query(`CREATE SEQUENCE IF NOT EXISTS telemetry_seq START 1`);
            await conn.query(`CREATE TABLE IF NOT EXISTS telemetry (
                seq BIGINT DEFAULT nextval('telemetry_seq'),
                id VARCHAR, lat DOUBLE, lon DOUBLE, alt DOUBLE,
                timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            )`);
            document.getElementById('db-status').innerText = "DuckDB-Wasm Ready";
        }

        // --- 2. INITIALIZE MAP ---
        // OpenFreeMap "Liberty": free, no API key, unlimited — full OpenStreetMap detail
        // (roads, buildings, land use, water, POI/place labels), unlike the blank demotiles style.
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [78.0, 15.0], // Centered on the proxy's OpenSky bounding box (South-Central India)
            zoom: 6.5,
            pitch: 45,
            attributionControl: { compact: true }
        });
        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');
        map.addControl(new maplibregl.FullscreenControl(), 'top-right');
        map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true } }), 'top-right');

        // Draw a small triangular "plane" icon in code (no external asset needed).
        // Registered as an SDF image so `icon-color` can recolor it per-aircraft (by altitude).
        function addPlaneIcon() {
            const size = 32;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(size * 0.5, 0);
            ctx.lineTo(size * 0.85, size * 0.9);
            ctx.lineTo(size * 0.5, size * 0.68);
            ctx.lineTo(size * 0.15, size * 0.9);
            ctx.closePath();
            ctx.fill();
            map.addImage('plane-icon', ctx.getImageData(0, 0, size, size), { sdf: true });
        }

        // Google-Maps-style extruded 3D buildings, added under the style's first label
        // layer so place names stay readable. Reads the building source/source-layer
        // straight off the loaded style instead of hardcoding names, so it keeps working
        // if OpenFreeMap changes its schema.
        function add3DBuildings() {
            const style = map.getStyle();
            const buildingRef = style.layers.find(l => l.type === 'fill' && l['source-layer'] === 'building');
            if (!buildingRef) return; // style schema changed or zoomed layer not present; skip gracefully
            const labelLayerId = style.layers.find(l => l.type === 'symbol' && l.layout && l.layout['text-field'])?.id;
            map.addLayer({
                id: '3d-buildings',
                type: 'fill-extrusion',
                source: buildingRef.source,
                'source-layer': buildingRef['source-layer'],
                minzoom: 13,
                paint: {
                    'fill-extrusion-color': '#4a5568',
                    'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 8],
                    'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], ['get', 'min_height'], 0],
                    'fill-extrusion-opacity': 0.75
                }
            }, labelLayerId);
        }

        const popup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, offset: 14 });

        map.on('load', () => {
            addPlaneIcon();
            add3DBuildings();

            map.addSource('telemetry', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
            map.addLayer({
                id: 'telemetry-points',
                type: 'symbol',
                source: 'telemetry',
                layout: {
                    'icon-image': 'plane-icon',
                    'icon-size': 0.7,
                    'icon-rotate': ['get', 'track'],
                    'icon-rotation-alignment': 'map',
                    'icon-allow-overlap': true,
                    'icon-ignore-placement': true
                },
                paint: {
                    // Colored by altitude: green (low) -> cyan (cruise) -> orange (high)
                    'icon-color': [
                        'interpolate', ['linear'], ['get', 'alt'],
                        0, '#00ff66',
                        6000, '#00ffcc',
                        12000, '#ff9900'
                    ],
                    'icon-halo-color': '#060913',
                    'icon-halo-width': 1.2
                }
            });

            map.on('click', 'telemetry-points', (e) => {
                const p = e.features[0].properties;
                popup.setLngLat(e.features[0].geometry.coordinates.slice())
                    .setHTML(`<div id="popup-title">✈ ${p.id}</div>` +
                        `Altitude: ${Math.round(p.alt)} m<br>` +
                        `Speed: ${p.speed ? Math.round(p.speed * 3.6) + ' km/h' : 'n/a'}<br>` +
                        `Heading: ${p.track != null ? Math.round(p.track) + '°' : 'n/a'}<br>` +
                        `Origin: ${p.country || 'Unknown'}`)
                    .addTo(map);
            });
            map.on('mouseenter', 'telemetry-points', () => map.getCanvas().style.cursor = 'pointer');
            map.on('mouseleave', 'telemetry-points', () => map.getCanvas().style.cursor = '');

            startTelemetryLoop();
        });

        // --- OSM PLACE SEARCH (Nominatim) ---
        // Free, no API key, part of the OpenStreetMap project — lets you jump anywhere on the map.
        const searchInput = document.getElementById('search-input');
        const searchResults = document.getElementById('search-results');
        let searchTimer = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            const q = searchInput.value.trim();
            if (q.length < 3) { searchResults.style.display = 'none'; return; }
            searchTimer = setTimeout(async () => {
                try {
                    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(q)}`;
                    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
                    const places = await res.json();
                    searchResults.innerHTML = '';
                    places.forEach(place => {
                        const row = document.createElement('div');
                        row.textContent = place.display_name;
                        row.onclick = () => {
                            map.flyTo({ center: [parseFloat(place.lon), parseFloat(place.lat)], zoom: 12, pitch: 45 });
                            searchResults.style.display = 'none';
                            searchInput.value = place.display_name;
                        };
                        searchResults.appendChild(row);
                    });
                    searchResults.style.display = places.length ? 'block' : 'none';
                } catch (e) {
                    console.error("Place search failed:", e);
                }
            }, 400); // debounce so we don't hammer Nominatim's free tier
        });

        // --- 3. INITIALIZE AI (TinyLlama-1.1B) ---
        async function initAI() {
            try {
                document.getElementById('ai-status').innerText = "Downloading TinyLlama (~600MB)...";
                // Transformers.js v2 runs on WebAssembly (CPU); it has no WebGPU backend
                aiGenerator = await pipeline('text-generation', 'Xenova/TinyLlama-1.1B-Chat-v1.0');
                
                document.getElementById('ai-status').innerText = "Online (Local Wasm)";
                document.getElementById('ai-status').classList.add('highlight');
                document.getElementById('ai-input').disabled = false;
                document.getElementById('ai-btn').disabled = false;
                document.getElementById('ai-response').innerText = "AI Ready. Ask a question.";
            } catch (err) {
                document.getElementById('ai-status').innerText = "AI Load Failed";
                document.getElementById('ai-status').classList.add('error');
                document.getElementById('ai-response').innerText = "Check console (F12) for details.";
                console.error("AI Initialization Error:", err);
            }
        }

        // --- 4. TELEMETRY LOOP (Rolling Window) ---
        async function startTelemetryLoop() {
            if (!PROXY_CONFIGURED) {
                document.getElementById('feed-status').innerText = "Proxy URL not set";
                document.getElementById('feed-status').classList.add('error');
                console.error("Set DEFAULT_PROXY_URL in index.html, or open this page with ?proxy=<your worker URL>");
                return;
            }
            document.getElementById('feed-status').innerText = "Connecting...";

            const poll = async () => {
                try {
                    if (!conn) return; // DuckDB still booting; next tick will catch up
                    const response = await fetch(FEED_URL);
                    if (!response.ok) throw new Error(`Proxy failed: HTTP ${response.status}`);
                    const data = await response.json();
                    
                    if (data.states && Array.isArray(data.states)) {
                        // Process OpenSky data: [icao24, callsign, origin_country, time_position, last_contact,
                        //                        longitude, latitude, baro_altitude, on_ground, velocity, true_track, ...]
                        const freshBatch = data.states.map(s => ({
                            id: s[1]?.trim() || s[0], // callsign or icao24
                            country: s[2],
                            lon: s[5],
                            lat: s[6],
                            alt: s[7],
                            speed: s[9],
                            track: s[10]
                        })).filter(s => s.lat !== null && s.lon !== null); // Filter invalid coords
                        activeNow = freshBatch.length;

                        // Append only the new batch (not the whole rolling window) so the SQL
                        // stays small and fast even as the window grows.
                        if (freshBatch.length > 0) {
                            const values = freshBatch.map(r =>
                                `('${String(r.id).replace(/'/g, "''")}', ${r.lat}, ${r.lon}, ${r.alt || 0}, CURRENT_TIMESTAMP)`
                            ).join(', ');
                            await conn.query(`INSERT INTO telemetry (id, lat, lon, alt, timestamp) VALUES ${values}`);
                        }
                        // Trim anything older than MAX_ROWS off the front of the window by insert order.
                        await conn.query(`DELETE FROM telemetry WHERE seq <= (SELECT COALESCE(MAX(seq), 0) FROM telemetry) - ${MAX_ROWS}`);

                        const statsResult = await conn.query(`SELECT COUNT(*) AS total, COUNT(DISTINCT id) AS unique_flights FROM telemetry`);
                        const stats = statsResult.toArray()[0];
                        totalTracked = Number(stats.total);
                        uniqueFlights = Number(stats.unique_flights);

                        // Update Map (latest snapshot only, so each aircraft is drawn once, with a rotated icon)
                        const features = freshBatch.map(t => ({
                            type: 'Feature',
                            geometry: { type: 'Point', coordinates: [t.lon, t.lat] },
                            properties: { id: t.id, alt: t.alt || 0, speed: t.speed, track: t.track, country: t.country }
                        }));
                        map.getSource('telemetry').setData({ type: 'FeatureCollection', features });

                        // Update HUD
                        document.getElementById('db-status').innerText = `${totalTracked} Tracks (Max ${MAX_ROWS})`;
                        document.getElementById('feed-status').innerText = DEMO_MODE ? `DEMO DATA (${activeNow} simulated)` : `Streaming Live (${activeNow} aircraft)`;
                        document.getElementById('feed-status').classList.remove('error');
                        document.getElementById('feed-status').classList.add('highlight');
                    }
                } catch (e) {
                    document.getElementById('feed-status').innerText = "Proxy Error";
                    document.getElementById('feed-status').classList.remove('highlight');
                    document.getElementById('feed-status').classList.add('error');
                    console.error("Telemetry Error:", e);
                }
            };

            poll();
            setInterval(poll, 10000); // 10-second poll
        }

        // --- 5. AI QUERY FUNCTION ---
        window.queryAI = async function() {
            const input = document.getElementById('ai-input');
            const responseDiv = document.getElementById('ai-response');
            const btn = document.getElementById('ai-btn');
            const prompt = input.value.trim();
            if (!prompt || !aiGenerator) return;

            responseDiv.innerText = "Thinking...";
            input.disabled = true;
            btn.disabled = true;

            try {
                // 1. Build context from the stats already read back from DuckDB on the last poll.
                // The feed is only current position snapshots (OpenSky state vectors) — no routes,
                // origins or destinations — so the model is told plainly not to invent those.
                const source = DEMO_MODE ? 'NOTE: this is simulated demo data, not real flights. ' : '';
                const context = `${source}${activeNow} flights are currently active in the latest snapshot. ` +
                    `The rolling history holds ${totalTracked} total data points representing ${uniqueFlights} unique flights. ` +
                    `You only have each aircraft's current position and altitude — no flight routes, origin airports, or destination airports. ` +
                    `If asked about a specific route (e.g. "flights from X to Y"), say plainly that this data has no route information.`;

                // 2. Format prompt specifically for TinyLlama
                const promptText = `<|system|>\nYou are a helpful AI assistant analyzing live flight data. Answer concisely based ONLY on the provided context.\n<|user|>\nContext: ${context}. User Question: ${prompt}\n<|assistant|>\n`;

                // 3. Generate response. Retry once with a smaller/greedy config if the first
                // attempt fails (WASM inference can run out of memory on constrained devices).
                let result;
                try {
                    result = await aiGenerator(promptText, { max_new_tokens: 100, temperature: 0.1, do_sample: false });
                } catch (firstErr) {
                    console.warn("AI generation failed, retrying with a smaller config:", firstErr);
                    result = await aiGenerator(promptText, { max_new_tokens: 40, do_sample: false });
                }

                // Extract the generated text
                const answer = result[0].generated_text.split('<|assistant|>\n').pop().trim();
                responseDiv.innerText = answer || "(empty response)";
                responseDiv.style.color = "#00ffcc";
            } catch (err) {
                // Show the real error inline (not just in the console) so it's visible on
                // mobile too, and so it can be reported back without opening devtools.
                const detail = (err && err.message) ? err.message : String(err);
                responseDiv.innerText = `AI Query Failed: ${detail}`;
                responseDiv.style.color = "#ff3333";
                console.error("AI Query Error:", err);
            } finally {
                input.disabled = false;
                btn.disabled = false;
                input.focus();
            }
        };

        // --- BOOT SEQUENCE ---
        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            await initAI();
        });
    </script>
</body>
</html>
